<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9Like - Earn and Grow</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <header>
        <h1>Welcome to 9Like</h1>
        <p>Earn rewards by completing tasks and inviting friends!</p>
    </header>

    <hr>

    <nav>
        <a href="#">Home</a> |
        <a href="#">Register</a> |
        <a href="#">Login</a> |
        <a href="#">Dashboard</a>
    </nav>

    <hr>

    <section>
        <h2>Features</h2>
        <ul>
            <li>Daily Tasks</li>
            <li>Referral Program</li>
            <li>Wallet Balance</li>
            <li>Withdrawal Requests</li>
        </ul>
    </section>

    <section>
        <h2>Create an Account</h2>

        <form id="registerForm">
            <label>Full Name:</label><br>
            <input id="fullName" type="text" placeholder="Enter your full name"><br><br>

            <label>Email:</label><br>
            <input id="email" type="email" placeholder="Enter your email"><br><br>

            <label>Password:</label><br>
            <input id="password" type="password" placeholder="Enter your password"><br><br>

            <button type="submit">Register</button>
        </form>
    </section>

    <hr>

    <footer>
        <p>&copy; 2026 9Like. All rights reserved.</p>
    </footer>

    <script src="/script.js" defer></script>
</body>
</html>
